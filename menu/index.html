const catName = c => c.l && c.l !== c.n ? c.l : ((CN[c.n] || [])[li()] || c.n);
const algTxt = a => String(a || '').split(',').map(x => x.trim()).filter(Boolean).map(x => (ALG[x] || [])[li()] || x).join(', ');
let cats = JSON.parse(JSON.stringify(DATA.cats)), hours = HOURS0;

/* Les réglages du site (prix, noms, photos, plats épuisés ou ajoutés) sont repris automatiquement */
function applyCF(CF) {
  if (!CF || typeof CF !== 'object') return;
  const byId = {}; DATA.cats.forEach(c => c.items.forEach(i => byId[i.id] = i));
  let base = DATA.cats.map(c => ({...c, items: c.items.map(i => ({...i}))}));
  if (CF.customD) { /* carte réécrite dans les réglages : on la relit ligne par ligne */
    base = [];
    String(CF.customD).split('\n').filter(Boolean).forEach((ln, ci) => {
      const [n, e, pre, items] = ln.split('|'); if (items === undefined) return;
      const old = DATA.cats.find(c => c.n === n.trim()) || {items: []};
      const c = {i: ci, n: n.trim(), e: (e || '🍽️').trim(), pre: (pre || '').trim(), note: !!old.note, items: []};
      items.split(';').filter(Boolean).forEach((t, j) => {
        const m = t.trim().match(/^(.*) (\d*\.?\d+)$/); if (!m) return;
        const nm = m[1].trim(), o = old.items.find(x => x.n === nm) || {};
        c.items.push({...o, id: ci + '-' + j, n: nm, f: c.pre && !nm.toLowerCase().startsWith(c.pre.toLowerCase()) ? c.pre + ' ' + nm : nm, p: +m[2]});
      });
      base.push(c);
    });
  }
  const ov = CF.ov || {}, ph = CF.ph || {}, cc = CF.cat || {};
  cats = base.map(c => {
    const co = cc[c.i] || {};
    const items = [];
    c.items.forEach(it => {
      const o = ov[it.id] || {}; if (o.del) return;
      const x = {...it};
      if (o.n !== undefined && o.n !== '') { x.n = o.n; x.f = c.pre && !o.n.toLowerCase().startsWith(c.pre.toLowerCase()) ? c.pre + ' ' + o.n : o.n; }
      if (o.p !== undefined && o.p !== '') x.p = +o.p;
      if (o.out) x.out = 1; else delete x.out;
      if (o.d) x.d = o.d; if (o.a) x.a = o.a;
      const pu = ph[it.id]; if (pu) x.img = pu;
      items.push(x);
    });
    ((CF.added || {})[c.n] || []).forEach((ad, aj) => {
      if (!ad || ad.del) return;
      const id = 'add-' + c.i + '-' + aj;
      items.push({id, n: ad.n, f: c.pre && !String(ad.n).toLowerCase().startsWith(c.pre.toLowerCase()) ? c.pre + ' ' + ad.n : ad.n, p: +ad.p, d: ad.d || '', a: ad.a || '', img: ph[id] || ad.img || '', out: ad.out ? 1 : 0});
    });
    return {...c, l: co.l || '', hide: !!co.hide, cd: co.d || '', items};
  }).filter(c => !c.hide && c.items.length);
  if (CF.cfg && CF.cfg.hours) hours = CF.cfg.hours;
}

function hoursInfo() {
  const H = String(hours).split(','), now = new Date(), d = (now.getDay() + 6) % 7, t = now.getHours() * 60 + now.getMinutes();
  const mm = s => { const m = String(s || '').match(/(\d+):(\d+)/); return m ? +m[1] * 60 + +m[2] : null; };
  const r = (H[d] || '').split('-'), a = mm(r[0]), b = mm(r[1]);
  if (a != null && b != null && t >= a && t < b) return [1, U('open') + ' · ' + U('until') + ' ' + r[1]];
  if (a != null && t < a) return [0, U('closed') + ' · ' + U('opens') + ' ' + r[0]];
  return [0, U('closed')];
}

let obs;
function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  try { localStorage.setItem('hflang', lang); } catch (e) {}
  $('#lg').innerHTML = LANGS.map(l => `<button class="${l === lang ? 'on' : ''}" data-l="${l}">${l === 'ar' ? 'عربي' : l.toUpperCase()}</button>`).join('');
  $('#t_sub').textContent = U('sub');
  $('#tags').innerHTML = [U('halal'), U('place'), U('take')].map(t => `<span>${esc(t)}</span>`).join('');
  const [op, tx] = hoursInfo(); $('#st').className = 'st' + (op ? '' : ' off'); $('#st span').textContent = tx;
  $('#q').placeholder = U('search');
  $('#chips').innerHTML = cats.map(c => `<a href="#c${c.i}" data-c="${c.i}">${c.e} ${esc(catName(c))}</a>`).join('');
  const q = norm($('#q').value.trim());
  let any = false;
  $('#m').innerHTML = cats.map(c => {
    const its = c.items.filter(i => !q || norm(i.f + ' ' + i.n + ' ' + c.n + ' ' + catName(c) + ' ' + (i.d || '')).includes(q));
    if (!its.length) return '';
    any = true;
    const sau = c.n === 'Sauces';
    return `<section id="c${c.i}" data-c="${c.i}"><h2><span class="e">${c.e}</span><span class="gold">${esc(catName(c))}</span></h2>`
      + (c.cd ? `<p class="nt">${esc(c.cd)}</p>` : '') + (c.note ? `<p class="nt">${esc(U('note'))}</p>` : '')
      + `<div class="grid${sau ? ' sau' : ''}">` + its.map(i => {
        const sub = sau ? (i.g || '') : (i.d || '');
        return `<button class="c${i.out ? ' out' : ''}" data-id="${esc(i.id)}"><div class="ph" data-out="${esc(U('out'))}" style="background-image:url('${esc(img(i.img))}')"><span class="pr">${eur(i.p)}</span></div><div class="bd"><b>${esc(sau ? i.n : i.f)}</b>${sub ? `<p>${esc(sub)}</p>` : ''}${!sau && i.a ? `<span class="al">${esc(algTxt(i.a))}</span>` : ''}</div></button>`;
      }).join('') + `</div></section>`;
  }).join('') || '';
  if (!any) $('#m').innerHTML = `<p class="empty">${esc(U('none'))}</p>`;
  const H = String(hours).split(',');
  $('#hrs').innerHTML = U('days').map((d, k) => `<span>${esc(d)}</span><span class="t" dir="ltr">${esc(H[k] ? H[k].replace('-', ' – ') : U('dclosed'))}</span>`).join('');
  $('#b_order span').textContent = U('order'); $('#b_call span').textContent = U('call'); $('#b_map span').textContent = U('map'); $('#b_rev span').textContent = U('rev');
  $('#ft').innerHTML = esc(U('algAsk')) + '<br>' + esc(U('vat')) + '<br>Haythem Food · TVA BE1030348450';
  /* apparition douce des plats */
  if (obs) obs.disconnect();
  const cs = document.querySelectorAll('.c');
  if ('IntersectionObserver' in window) {
    obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } }), {rootMargin: '0px 0px -20px 0px'});
    cs.forEach(c => obs.observe(c));
  } else cs.forEach(c => c.classList.add('in'));
  spy();
}

function find(id) { for (const c of cats) for (const i of c.items) if (i.id === id) return [c, i]; return []; }
function openItem(id) {
  const [c, i] = find(id); if (!i) return;
  const sau = c.n === 'Sauces';
  $('#sh').innerHTML = `<div class="ph" style="background-image:url('${esc(hd(i.img))}'),url('${esc(img(i.img))}')"><button class="x" aria-label="${esc(U('close'))}">✕</button></div><div class="bd"><h4 class="gold">${esc(sau ? i.n : i.f)}</h4><span class="pr">${eur(i.p)}</span>`
    + (i.out ? ` <span class="pr" style="background:#ef4444;color:#fff">${esc(U('out'))}</span>` : '')
    + (sau && i.g ? `<p>${esc(i.g)}</p>` : '') + (i.d ? `<p>${esc(i.d)}</p>` : '')
    + (i.v && i.v.length ? `<p style="margin-top:14px;font-weight:700;color:var(--gold2)">${esc(U('softs'))} :</p><div class="vl">${i.v.map(v => `<span>${esc(v)}</span>`).join('')}</div>` : '')
    + `<div class="al">⚠ ${esc(U('alg'))} : ${esc(i.a ? algTxt(i.a) : '—')}</div>`
    + `</div>`;
  $('#ov').classList.add('on');
}
const closeItem = () => $('#ov').classList.remove('on');

/* catégorie active dans la barre du haut */
function spy() {
  const secs = [...document.querySelectorAll('section')]; let cur = secs[0];
  for (const s of secs) if (s.getBoundingClientRect().top < 140) cur = s;
  document.querySelectorAll('.chips a').forEach(a => {
    const on = cur && a.dataset.c === cur.dataset.c;
    if (on && !a.classList.contains('on')) { a.classList.add('on'); const ch = $('#chips'); ch.scrollTo({left: a.offsetLeft - ch.clientWidth / 2 + a.offsetWidth / 2, behavior: 'smooth'}); }
    else if (!on) a.classList.remove('on');
  });
  $('#up').classList.toggle('on', scrollY > 900);
}
let ticking = false;
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { spy(); ticking = false; }); } }, {passive: true});
document.addEventListener('click', e => {
  const l = e.target.closest('[data-l]'); if (l) { lang = l.dataset.l; render(); return; }
  const c = e.target.closest('.c'); if (c) { openItem(c.dataset.id); return; }
  if (e.target.closest('.x') || e.target.id === 'ov') { closeItem(); return; }
  const a = e.target.closest('.chips a');
  if (a) { e.preventDefault(); const s = document.getElementById('c' + a.dataset.c); if (s) s.scrollIntoView({behavior: 'smooth', block: 'start'}); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') closeItem(); });
$('#up').onclick = () => scrollTo({top: 0, behavior: 'smooth'});
let qt; $('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(render, 150); });

render();
/* prix et plats à jour depuis les réglages du site (si la connexion le permet) */
(async () => {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(DB + '/site_config.json', {cache: 'no-store', signal: ctl.signal});
    if (!r.ok) return;
    const CF = await r.json();
    if (CF) { applyCF(CF); render(); }
  } catch (e) {}
})();
setInterval(() => { const [op, tx] = hoursInfo(); $('#st').className = 'st' + (op ? '' : ' off'); $('#st span').textContent = tx; }, 60000);
</script>
</body>
